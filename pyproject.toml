[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heagital-mde"
version = "0.2.0"
description = "Auditable, ranked NHS ICB market entry decisions for UK MedTech."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
app = [
    "streamlit>=1.32",
    "plotly>=5.20",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
heagital-mde = "heagital_mde.cli.run:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
heagital_mde = ["config/*.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::UserWarning"]
