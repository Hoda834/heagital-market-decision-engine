[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heagital-mde"
version = "0.2.0"
description = "Auditable, ranked NHS ICB market entry decisions for UK MedTech."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
app = [
    # >=1.49 for the `width` argument that replaced `use_container_width`.
    "streamlit>=1.49",
    # The map helpers work on both plotly 5 (scatter_mapbox) and 6 (scatter_map).
    "plotly>=5.20",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
heagital-mde = "heagital_mde.cli.run:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
heagital_mde = ["config/*.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Validation and loader warnings are part of the contract and are asserted on
# directly, so they are silenced only where they would be incidental noise.
filterwarnings = [
    "ignore:.*Treatment Gap.*:UserWarning",
    "ignore:.*ICB row.*:UserWarning",
    "ignore:.*region is blank.*:UserWarning",
]
